# Configuración del Jupyter Book
# Ajusta el título, el autor y la URL de tu repositorio.
title: "EDA Bancario — Fuga y Valor del Cliente"
author: "Ruben Esguerra"
logo: ""

# IMPORTANTE: usa las salidas ya guardadas en el .ipynb (NO re-ejecuta el notebook).
# Así se ve "ya ejecutado" sin necesitar los CSV en el repositorio.
execute:
  execute_notebooks: "off"

# Solo construye los archivos listados en _toc.yml
only_build_toc_files: true

# Enlace al repositorio (cambia <TU_USUARIO> y <TU_REPO>)
repository:
  url: https://github.com/<TU_USUARIO>/<TU_REPO>
  branch: main

html:
  use_issues_button: false
  use_repository_button: true
  use_edit_page_button: false

# Permite ecuaciones/mates si las agregas más adelante
parse:
  myst_enable_extensions:
    - dollarmath
    - amsmath
